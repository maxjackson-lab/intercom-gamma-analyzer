name: Verify System Optimizations

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prompt optimization tests
        run: |
          pytest tests/test_prompt_optimization.py -v --maxfail=1 --disable-warnings --cov=src --cov-report=xml

      - name: Run end-to-end verification tests
        run: |
          pytest tests/test_end_to_end_verification.py -v --maxfail=1 --disable-warnings

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimization-tests
          path: |
            .coverage
            coverage.xml
            .pytest_cache

  sample-mode-verification:
    runs-on: ubuntu-latest
    needs: test-suite
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sample-mode (20 conversations)
        run: |
          python src/main.py sample-mode --count 20 --save-to-file

      - name: Analyze sample-mode artifacts
        run: |
          python scripts/analyze_sample_mode_output.py --output-dir analysis_reports

      - name: Upload sample-mode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-mode-artifacts
          path: |
            outputs
            analysis_reports

  multi-language-test:
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run multi-language keyword verification
        run: |
          python scripts/test_multi_language_keywords.py --language all --output-dir test_outputs

      - name: Upload multi-language results
        uses: actions/upload-artifact@v4
        with:
          name: multi-language-results
          path: test_outputs

  verification-report:
    runs-on: ubuntu-latest
    needs:
      - test-suite
      - sample-mode-verification
      - multi-language-test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Run verification orchestrator
        run: |
          python scripts/verify_optimizations.py --test-suite --sample-mode --multi-language --sample-count 20 --output-dir verification_outputs

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification_outputs


